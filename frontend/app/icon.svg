<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    
    <!-- Emerald Badge Gradient -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Glassmorphism Document Gradient -->
    <linearGradient id="doc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Square Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Stylized Scanner Glow Effect -->
  <path d="M 64,180 L 448,180" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" opacity="0.6" filter="url(#shadow)" />
  <path d="M 64,180 L 448,180" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />

  <!-- Document (Resume) Body -->
  <g filter="url(#shadow)">
    <!-- Main page -->
    <path d="M 160,110 L 290,110 L 352,172 L 352,380 C 352,391 343,400 332,400 L 160,400 C 149,400 140,391 140,380 L 140,130 C 140,119 149,110 160,110 Z" fill="url(#doc-grad)" />
    <!-- Folded corner -->
    <path d="M 290,110 L 290,172 L 352,172 Z" fill="#e2e8f0" />
  </g>

  <!-- Document Lines (Text) -->
  <rect x="175" y="190" width="100" height="12" rx="6" fill="#94a3b8" />
  <rect x="175" y="220" width="140" height="12" rx="6" fill="#cbd5e1" />
  <rect x="175" y="250" width="120" height="12" rx="6" fill="#cbd5e1" />
  <rect x="175" y="280" width="130" height="12" rx="6" fill="#cbd5e1" />
  <rect x="175" y="310" width="90" height="12" rx="6" fill="#cbd5e1" />

  <!-- Emerald Verified Badge (ATS Approved Checkmark) -->
  <circle cx="340" cy="340" r="60" fill="url(#badge-grad)" filter="url(#shadow)" stroke="#ffffff" stroke-width="8" />
  
  <!-- Checkmark SVG path inside badge -->
  <path d="M 312,340 L 332,360 L 372,320" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
</svg>
